services:
  # ─── PostgreSQL 16 ─────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: agen
      POSTGRES_PASSWORD: agen_pass
      POSTGRES_DB: agen
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agen"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agen_network

  # ─── Redis 7 ──────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agen_network

  # ─── FastAPI Backend API ───────────────────────────────────
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://agen:agen_pass@db:5432/agen
      - DATABASE_URL_SYNC=postgresql://agen:agen_pass@db:5432/agen
      - REDIS_URL=redis://redis:6379/0
      - RUN_MIGRATIONS=true
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./apps/api:/app
    networks:
      - agen_network
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  # ─── ARQ Background Worker ─────────────────────────────────
  worker:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://agen:agen_pass@db:5432/agen
      - DATABASE_URL_SYNC=postgresql://agen:agen_pass@db:5432/agen
      - REDIS_URL=redis://redis:6379/0
      - RUN_MIGRATIONS=false
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started
    volumes:
      - ./apps/api:/app
    networks:
      - agen_network
    command: arq workers.main.WorkerSettings

  # ─── Next.js Owner Dashboard ──────────────────────────────
  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXTAUTH_URL=http://localhost:3000
    ports:
      - "3000:3000"
    depends_on:
      - api
    networks:
      - agen_network

volumes:
  postgres_data:
  redis_data:

networks:
  agen_network:
    driver: bridge
